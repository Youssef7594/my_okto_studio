security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        in_memory:
            memory:
                users:
                    admin:
                        password: '$2y$13$Qppiqf8ua8NE0rHXzRCg6uoneKwyWCxDzHr8XuWz1gbHT9pa0pEHO' 
                        roles: ['ROLE_ADMIN']

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: in_memory
            form_login:
                login_path: security_login  # Assure-toi que la route est correcte
                check_path: security_login   # Même route pour la validation
            logout:
                path: security_logout        # Déconnexion
                target: /

    access_control:
        - { path: ^/Admin, roles: ROLE_ADMIN }
